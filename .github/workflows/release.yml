name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build and Package
        run: |
          bun run build
          bun run package

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum plugin_package.zip > checksums.txt

      - name: Sign plugin
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > private.pem
          openssl pkeyutl -sign -inkey private.pem -out plugin_package.zip.sig -rawin -in dist/plugin_package.zip
          rm private.pem

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plugin_package.zip
            plugin_package.zip.sig
            dist/checksums.txt
